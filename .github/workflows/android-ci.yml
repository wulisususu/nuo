name: Android CI

on:
  push:
    branches: [main, floating-window]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build floating-window debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload floating-window APK
        uses: actions/upload-artifact@v4
        with:
          name: license-overlay-floating-window-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
