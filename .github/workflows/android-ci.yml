name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build both debug APKs
        run: gradle --no-daemon :app:assembleDebug :overlayonly:assembleDebug

      - name: Upload V4 accessibility APK
        uses: actions/upload-artifact@v4
        with:
          name: license-overlay-v4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload overlay-only V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: license-overlay-no-accessibility-v1-debug-apk
          path: overlayonly/build/outputs/apk/debug/overlayonly-debug.apk
          if-no-files-found: error
